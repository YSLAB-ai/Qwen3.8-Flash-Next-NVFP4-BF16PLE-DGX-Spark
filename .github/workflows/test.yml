name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=src:. python3 -m unittest discover -s tests -v
      - run: bash -n scripts/*.sh scripts/qwen38-dgx-spark
      - run: python3 tools/audit_publication.py
